server.port=0

# --- Sandboxed rule runtime defaults ---------------------------------------
# Number of isolated sandbox worker threads. Slow/aborted scripts occupy their
# own worker and never block the others.
rule.sandbox.worker-threads=8
# Per-execution wall-clock budget (milliseconds).
rule.sandbox.default-timeout-millis=2000
# Per-execution retained-heap budget (bytes). Measured as post-GC live-heap growth,
# so short-lived interpreter churn on CPU-bound scripts is not counted.
rule.sandbox.default-memory-bytes=33554432
# Maximum bytes a script may print/capture as output before OUTPUT_LIMIT.
rule.sandbox.default-output-bytes=65536
# Maximum nested guest call depth enforced by the Truffle depth instrument.
rule.sandbox.default-recursion-depth=500
# Maximum guest statements per execution (backstop for tight loops).
rule.sandbox.default-statement-limit=5000000
# Number of historical versions retained per rule (for rollback / in-flight finish).
rule.sandbox.history-per-rule=20
